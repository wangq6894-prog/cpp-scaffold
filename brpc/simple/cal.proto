syntax = "proto3";
package cal;
option cc_generic_services = true;

message AddReq{
    int32 num1 = 1;
    int32 num2 = 2;
}

message AddRsp{
    int32 result = 1;
}

message helloReq{
    //用于http请求，不需要其他字段
}
message helloRsp{
    //用于http响应，不需要其他字段
}

service CalService{
    rpc Add(AddReq) returns (AddRsp);
    rpc Hello(helloReq) returns (helloRsp);
}
