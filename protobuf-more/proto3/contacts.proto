// 首行：语法指定行
syntax = "proto3"; //不写默认proto2
package contacts2;  //同namespace

//定义联系人message
message PeopleInfo {
  string name = 1; //姓名
  int32 age = 2;   //年龄

  message Phone{
    string number = 1;
    enum PhoneType{
      //枚举默认值为0
      MP = 0;//移动电话
      TEL = 1;//固定电话
    }
    PhoneType type = 2;//电话类型
  }

  repeated Phone phone = 3; //电话信息
}

//通讯录 message
message Contacts{
  repeated PeopleInfo Contacts = 1;
}

